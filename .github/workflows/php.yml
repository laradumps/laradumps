name: LaraDumps Tests

on:
  pull_request:
    paths-ignore:
      - '*.md'

  push:
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ 8.5, 8.4, 8.3, 8.2 ]
        laravel: [ 13.*, 12.*, 11.* ]
        dependency-version: [ prefer-stable ]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
        exclude:
          - laravel: 13.*
          - php: 8.2

    name: "PHP: ${{ matrix.php }} / Laravel: ${{ matrix.laravel }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: $(composer config cache-files-dir)
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench-core:${{ matrix.testbench }}" --no-interaction --no-update --with-all-dependencies
          composer install

      - name: Pint 👨‍🏭
        if: matrix.php == '8.3'
        run: composer test:pint
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Larastan ⚗️
        if: matrix.php == '8.4' && matrix.laravel == '12.*'
        run: composer test:types

      - name: Pest Tests 👨🏻‍🔬
        run: composer test:tests
